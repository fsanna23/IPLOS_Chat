<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Questionario AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="chat-header">
            <div class="header-logo">
                <div class="logo-circle">
                    <img src="logo.jpeg" alt="Logo" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
                </div>
                <div>
                    <h1>PW SIPLO Assistant</h1>
                    <p class="status">Sempre attivo</p>
                </div>
            </div>
            <button class="header-action">Chiudi</button>
        </header>

        <!-- Chat Area -->
        <main class="chat-area" id="chat-messages">
            <!-- Messaggi inseriti dinamicamente via JS -->
            <!-- Esempio di loading indiciator da nascondere -->
            <div id="typing-indicator" class="message bot hidden">
                <div class="message-bubble typing">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <footer class="input-area">
            <textarea id="user-input" placeholder="Scrivi la tua risposta..." rows="1"></textarea>
            <button id="send-btn" disabled>
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </footer>
    </div>
    


    <script src="script.js"></script>
</body>
</html>
